<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | NovaTech</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #16213e;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #4fd1c5;
        }

        .hero {
            background: #16213e;
            color: white;
            text-align: center;
            padding: 65px 20px;
        }

        .hero h1 {
            font-size: 44px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #d9e1f2;
            font-size: 17px;
        }

        .form-container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            color: #16213e;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9e2;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4fd1c5;
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #16213e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #4fd1c5;
            color: #16213e;
        }

        footer {
            margin-top: 70px;
            background: #16213e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">NovaTech</div>

        <nav>
            <a href="about.html">About Us</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Make an Enquiry</h1>
        <p>
            Have a question or want to discuss a project?
            We'd love to hear from you.
        </p>
    </section>

    <main class="form-container">

        <div class="form-card">

            <h2>Enquiry Form</h2>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Enquiry Type</label>

                    <select id="subject" name="subject" required>
                        <option value="">Select an option</option>
                        <option value="general">General Enquiry</option>
                        <option value="service">Our Services</option>
                        <option value="project">New Project</option>
                        <option value="support">Support</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your enquiry here..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Submit Enquiry
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 NovaTech. All Rights Reserved.</p>
    </footer>

</body>
</html>
